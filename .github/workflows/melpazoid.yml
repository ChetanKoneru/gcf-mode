# melpazoid <https://github.com/riscy/melpazoid> build checks.

name: melpazoid

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Install melpazoid
        env:
          MELPAZOID_REVISION: 7bc2a1a84e201f8783401fb051350a97ebf9d963
        run: |
          sudo apt-get install emacs
          emacs --version
          git clone https://github.com/riscy/melpazoid.git "$RUNNER_TEMP/melpazoid"
          git -C "$RUNNER_TEMP/melpazoid" checkout "$MELPAZOID_REVISION"
      - name: Run melpazoid
        env:
          LOCAL_REPO: ${{ github.workspace }}
          RECIPE: '(gcf-mode :fetcher github :repo "ChetanKoneru/gcf-mode")'
          WARN_IS_ERROR: "false"
          EXIST_OK: "false"
        run: |
          echo "$GITHUB_REF"
          make -C "$RUNNER_TEMP/melpazoid"
